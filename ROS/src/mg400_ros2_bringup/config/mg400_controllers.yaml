controller_manager:
  ros__parameters:
    update_rate: 50

    # Broadcaster
    joint_state_broadcaster: 
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - "j1"
      - "j2_1"
      - "j3_1"
      - "j4_1"
      - "j5"
    command_interfaces:
      - position
      - velocity
      - acceleration
    state_interfaces:
      - position
      - velocity